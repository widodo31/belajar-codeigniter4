services:
  app:
    build: .
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      CI_ENVIRONMENT: development
      database.default.hostname: db
      database.default.database: aplikasi
      database.default.username: aplikasi_user
      database.default.password: belajar_2026
      database.default.DBDriver: MySQLi
      database.default.port: 3306
    
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8091:80"
    environment: 
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aplikasi_if
      MYSQL_USER: aplikasi_user
      MYSQL_PASSWORD: belajar_if_2026
      MYSQL_ROOT_PASSWORD: root_if_2026
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: